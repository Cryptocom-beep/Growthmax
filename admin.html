<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growthmax - Admin Panel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-6xl mx-auto space-y-8">
    <!-- Header -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-green-400">Growthmax Admin Panel</h1>
        <p class="text-sm text-slate-400">One-Click Deposit & Withdrawal Management</p>
      </div>
      <button onclick="loadAdminData()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium px-5 py-2.5 rounded-xl transition">
        Refresh Data
      </button>
    </div>

    <!-- Pending Deposits -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
      <h2 class="text-xl font-bold text-green-400 mb-4">Pending Deposits</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800/60 text-slate-400 text-xs uppercase tracking-wider">
              <th class="p-3">User Email</th>
              <th class="p-3">Plan</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Method</th>
              <th class="p-3">TXN Hash</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="deposits-table" class="divide-y divide-slate-800 text-sm">
            <tr>
              <td colspan="6" class="p-4 text-center text-slate-500">Loading deposits...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pending Withdrawals -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
      <h2 class="text-xl font-bold text-blue-400 mb-4">Pending Withdrawals</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800/60 text-slate-400 text-xs uppercase tracking-wider">
              <th class="p-3">User Email</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Wallet Address</th>
              <th class="p-3">Method</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="withdrawals-table" class="divide-y divide-slate-800 text-sm">
            <tr>
              <td colspan="5" class="p-4 text-center text-slate-500">Loading withdrawals...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Configured Supabase Credentials
    const SUPABASE_URL = 'https://psbokzosswthttvxppcf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzYm9rem9zc3d0aHR0dnhwcGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjYzNDYsImV4cCI6MjEwNjU0MjM0Nn0.diXojuSglO9Q26IbsYG8JsHHvyrbxnHsz9KtFnZnD7E';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAdminData() {
      await fetchDeposits();
      await fetchWithdrawals();
    }

    async function fetchDeposits() {
      const tbody = document.getElementById('deposits-table');
      const { data, error } = await db.from('deposits').select('*').eq('status', 'pending');

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-400">Error loading deposits: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">No pending deposits found.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(dep => `
        <tr class="hover:bg-slate-800/40">
          <td class="p-3">${dep.user_email || 'N/A'}</td>
          <td class="p-3 font-semibold text-slate-300">${dep.plan_name}</td>
          <td class="p-3 text-green-400 font-bold">$${dep.amount}</td>
          <td class="p-3 uppercase text-xs font-medium text-slate-400">${dep.payment_method}</td>
          <td class="p-3 font-mono text-xs text-slate-400">${dep.txn_hash || 'N/A'}</td>
          <td class="p-3 space-x-2">
            <button onclick="approveDeposit('${dep.id}', '${dep.user_id}', ${dep.amount})" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-1.5 rounded-lg">Approve</button>
            <button onclick="rejectDeposit('${dep.id}')" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg">Reject</button>
          </td>
        </tr>
      `).join('');
    }

    async function fetchWithdrawals() {
      const tbody = document.getElementById('withdrawals-table');
      const { data, error } = await db.from('withdrawals').select('*').eq('status', 'pending');

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">Error loading withdrawals: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500">No pending withdrawals found.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(w => `
        <tr class="hover:bg-slate-800/40">
          <td class="p-3">${w.user_email || 'N/A'}</td>
          <td class="p-3 text-blue-400 font-bold">$${w.amount}</td>
          <td class="p-3 font-mono text-xs text-slate-400">${w.wallet_address}</td>
          <td class="p-3 uppercase text-xs font-medium text-slate-400">${w.payment_method}</td>
          <td class="p-3 space-x-2">
            <button onclick="approveWithdrawal('${w.id}')" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-1.5 rounded-lg">Approve</button>
            <button onclick="rejectWithdrawal('${w.id}')" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg">Reject</button>
          </td>
        </tr>
      `).join('');
    }

    async function approveDeposit(depositId, userId, amount) {
      await db.from('deposits').update({ status: 'approved' }).eq('id', depositId);
      const { data: profile } = await db.from('profiles').select('balance').eq('id', userId).single();
      const currentBalance = profile ? parseFloat(profile.balance || 0) : 0;
      await db.from('profiles').update({ balance: currentBalance + parseFloat(amount) }).eq('id', userId);
      loadAdminData();
    }

    async function rejectDeposit(depositId) {
      await db.from('deposits').update({ status: 'rejected' }).eq('id', depositId);
      loadAdminData();
    }

    async function approveWithdrawal(withdrawalId) {
      await db.from('withdrawals').update({ status: 'approved' }).eq('id', withdrawalId);
      loadAdminData();
    }

    async function rejectWithdrawal(withdrawalId) {
      await db.from('withdrawals').update({ status: 'rejected' }).eq('id', withdrawalId);
      loadAdminData();
    }

    document.addEventListener('DOMContentLoaded', loadAdminData);
  </script>
</body>
</html>
