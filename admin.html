<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growthmax - Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-8">
    <div class="flex justify-between items-center bg-gray-900 p-6 rounded-2xl border border-gray-800">
      <div>
        <h1 class="text-2xl font-bold text-white">Growthmax Admin Panel</h1>
        <p class="text-xs text-gray-400">One-Click Deposit & Withdrawal Management</p>
      </div>
      <button onclick="loadAdminData()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-bold rounded-xl border border-gray-700">
        Refresh Data
      </button>
    </div>

    <!-- Pending Deposits Section -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4">
      <h2 class="text-lg font-bold text-green-400">Pending Deposits</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-400">
          <thead class="bg-gray-800 text-gray-300 uppercase">
            <tr>
              <th class="p-3">User Email</th>
              <th class="p-3">Plan</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Method</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="deposits-admin-list">
            <tr><td colspan="5" class="p-4 text-center">Loading deposits...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pending Withdrawals Section -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4">
      <h2 class="text-lg font-bold text-blue-400">Pending Withdrawals</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-400">
          <thead class="bg-gray-800 text-gray-300 uppercase">
            <tr>
              <th class="p-3">User Email</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Wallet Address</th>
              <th class="p-3">Method</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="withdrawals-admin-list">
            <tr><td colspan="5" class="p-4 text-center">Loading withdrawals...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAdminData() {
      // Fetch Pending Deposits
      const { data: deposits } = await supabase
        .from('deposits')
        .select('*')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      const depBody = document.getElementById('deposits-admin-list');
      if (!deposits || deposits.length === 0) {
        depBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No pending deposits.</td></tr>`;
      } else {
        depBody.innerHTML = deposits.map(d => `
          <tr class="border-b border-gray-800">
            <td class="p-3 text-white">${d.user_email || d.user_id}</td>
            <td class="p-3">${d.plan_name || 'Standard'}</td>
            <td class="p-3 font-bold text-green-400">$${parseFloat(d.amount).toFixed(2)}</td>
            <td class="p-3">${d.payment_method || 'N/A'}</td>
            <td class="p-3 space-x-2">
              <button onclick="updateDeposit('${d.id}', 'approved')" class="px-3 py-1 bg-green-500 hover:bg-green-600 text-gray-950 font-bold rounded-lg text-xs">Approve</button>
              <button onclick="updateDeposit('${d.id}', 'rejected')" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg text-xs">Reject</button>
            </td>
          </tr>
        `).join('');
      }

      // Fetch Pending Withdrawals
      const { data: withdrawals } = await supabase
        .from('withdrawals')
        .select('*')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      const wBody = document.getElementById('withdrawals-admin-list');
      if (!withdrawals || withdrawals.length === 0) {
        wBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No pending withdrawals.</td></tr>`;
      } else {
        wBody.innerHTML = withdrawals.map(w => `
          <tr class="border-b border-gray-800">
            <td class="p-3 text-white">${w.user_email || w.user_id}</td>
            <td class="p-3 font-bold text-blue-400">$${parseFloat(w.amount).toFixed(2)}</td>
            <td class="p-3 font-mono text-gray-300">${w.wallet_address}</td>
            <td class="p-3">${w.payment_method}</td>
            <td class="p-3 space-x-2">
              <button onclick="updateWithdrawal('${w.id}', 'approved')" class="px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg text-xs">Approve</button>
              <button onclick="updateWithdrawal('${w.id}', 'rejected')" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg text-xs">Reject</button>
            </td>
          </tr>
        `).join('');
      }
    }

    async function updateDeposit(id, status) {
      const { error } = await supabase.from('deposits').update({ status }).eq('id', id);
      if (error) alert(error.message);
      else loadAdminData();
    }

    async function updateWithdrawal(id, status) {
      const { error } = await supabase.from('withdrawals').update({ status }).eq('id', id);
      if (error) alert(error.message);
      else loadAdminData();
    }

    window.onload = loadAdminData;
  </script>
</body>
</html>
