<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growthmax - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 md:p-8">

  <!-- Header & Balance Banner -->
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h2 class="text-sm text-gray-400 uppercase tracking-wider font-semibold">Total Account Balance</h2>
        <h1 id="user-balance" class="text-4xl font-extrabold text-green-400 mt-1">$0.00</h1>
      </div>
      <div id="user-status" class="px-3 py-1 bg-gray-700 text-gray-300 rounded-full text-xs font-semibold">
        Connecting...
      </div>
    </div>

    <!-- Deposit Form -->
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg space-y-4">
      <h3 class="text-xl font-bold text-white border-b border-gray-700 pb-3">Make a Deposit</h3>
      
      <!-- Select Plan -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1 uppercase">Select Investment Plan</label>
        <select id="plan-select" onchange="calculateROI()" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500">
          <option value="Starter Plan|10|3" data-roi="10" data-duration="3 Days">Starter Plan (10% ROI in 3 Days)</option>
          <option value="Advanced Plan|25|7" data-roi="25" data-duration="7 Days">Advanced Plan (25% ROI in 7 Days)</option>
          <option value="VIP Premium Plan|50|14" data-roi="50" data-duration="14 Days">VIP Premium Plan (50% ROI in 14 Days)</option>
        </select>
      </div>

      <!-- Amount Input -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1 uppercase">Deposit Amount ($)</label>
        <input type="number" id="deposit-amount" oninput="calculateROI()" placeholder="e.g. 500" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500">
      </div>

      <!-- Payment Method -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1 uppercase">Payment Method</label>
        <select id="payment-method" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500">
          <option value="USDT TRC20">USDT (TRC20)</option>
          <option value="Bitcoin (BTC)">Bitcoin (BTC)</option>
          <option value="Ethereum (ETH)">Ethereum (ETH)</option>
        </select>
      </div>

      <!-- Live ROI Calculation Preview Card -->
      <div id="roi-summary" class="bg-gray-900/80 border border-gray-700 rounded-lg p-4 space-y-2">
        <div class="flex justify-between text-sm">
          <span class="text-gray-400">Plan Duration:</span>
          <span id="summary-duration" class="font-semibold text-white">3 Days</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-400">ROI Rate:</span>
          <span id="summary-rate" class="font-semibold text-green-400">10%</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-400">Estimated Profit:</span>
          <span id="summary-profit" class="font-semibold text-green-400">$0.00</span>
        </div>
        <div class="flex justify-between text-base font-bold border-t border-gray-800 pt-2 mt-2">
          <span class="text-gray-300">Total Return:</span>
          <span id="summary-total" class="text-green-400">$0.00</span>
        </div>
      </div>

      <button onclick="submitDeposit()" class="w-full bg-green-500 hover:bg-green-600 text-gray-900 font-bold py-3 rounded-lg transition duration-200">
        Submit Deposit
      </button>
    </div>

    <!-- Recent Deposits History Table -->
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-lg">
      <h3 class="text-xl font-bold text-white mb-4">Your Recent Deposits</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-400">
          <thead class="bg-gray-900 text-xs uppercase text-gray-400">
            <tr>
              <th class="p-3">Plan</th>
              <th class="p-3">Amount</th>
              <th class="p-3">Est. Profit</th>
              <th class="p-3">Duration</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="deposits-list">
            <tr>
              <td colspan="5" class="p-4 text-center">Loading deposits...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Initialize Supabase Client
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // 1. Calculate ROI, Profit & Duration in Real-time
    function calculateROI() {
      const select = document.getElementById('plan-select');
      const selectedOption = select.options[select.selectedIndex];
      const roiPercent = parseFloat(selectedOption.getAttribute('data-roi')) || 0;
      const duration = selectedOption.getAttribute('data-duration');
      const amount = parseFloat(document.getElementById('deposit-amount').value) || 0;

      const profit = (amount * roiPercent) / 100;
      const totalReturn = amount + profit;

      document.getElementById('summary-duration').innerText = duration;
      document.getElementById('summary-rate').innerText = `${roiPercent}%`;
      document.getElementById('summary-profit').innerText = `$${profit.toFixed(2)}`;
      document.getElementById('summary-total').innerText = `$${totalReturn.toFixed(2)}`;
    }

    // 2. Fetch User Profile and Calculate Balance
    async function loadUserData() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;
      currentUser = user;

      // Calculate Total Approved Deposits directly for live auto-update
      const { data: approvedDeposits } = await supabase
        .from('deposits')
        .select('amount')
        .eq('user_id', user.id)
        .eq('status', 'approved');

      const totalBalance = approvedDeposits 
        ? approvedDeposits.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0)
        : 0.00;

      document.getElementById('user-balance').innerText = `$${totalBalance.toFixed(2)}`;
      document.getElementById('user-status').innerText = 'Connected';

      fetchDeposits();
      listenToRealtimeDeposits();
    }

    // 3. Fetch Recent Deposits List
    async function fetchDeposits() {
      if (!currentUser) return;
      const { data: deposits, error } = await supabase
        .from('deposits')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('deposits-list');
      if (!deposits || deposits.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center">No deposits found.</td></tr>`;
        return;
      }

      tbody.innerHTML = deposits.map(dep => {
        const statusColor = dep.status === 'approved' 
          ? 'bg-green-900/50 text-green-400 border border-green-500/30' 
          : dep.status === 'rejected'
          ? 'bg-red-900/50 text-red-400 border border-red-500/30'
          : 'bg-yellow-900/50 text-yellow-400 border border-yellow-500/30';

        return `
          <tr class="border-b border-gray-800">
            <td class="p-3 font-semibold text-white">${dep.plan_name || 'Standard'}</td>
            <td class="p-3 text-green-400 font-bold">$${parseFloat(dep.amount).toFixed(2)}</td>
            <td class="p-3 text-gray-300">$${dep.profit ? parseFloat(dep.profit).toFixed(2) : '0.00'}</td>
            <td class="p-3 text-gray-400">${dep.duration || 'N/A'}</td>
            <td class="p-3"><span class="px-2 py-1 rounded-md text-xs uppercase font-bold ${statusColor}">${dep.status}</span></td>
          </tr>
        `;
      }).join('');
    }

    // 4. Submit New Deposit
    async function submitDeposit() {
      if (!currentUser) return alert('Please log in first!');
      
      const planSelect = document.getElementById('plan-select');
      const selectedOption = planSelect.options[planSelect.selectedIndex];
      const planName = selectedOption.text.split('(')[0].trim();
      const roiPercent = parseFloat(selectedOption.getAttribute('data-roi'));
      const duration = selectedOption.getAttribute('data-duration');
      
      const amount = parseFloat(document.getElementById('deposit-amount').value);
      const paymentMethod = document.getElementById('payment-method').value;

      if (!amount || amount <= 0) return alert('Please enter a valid amount');

      const profit = (amount * roiPercent) / 100;

      const { error } = await supabase.from('deposits').insert([
        {
          user_id: currentUser.id,
          user_email: currentUser.email,
          plan_name: planName,
          amount: amount,
          profit: profit,
          duration: duration,
          payment_method: paymentMethod,
          status: 'pending'
        }
      ]);

      if (error) {
        alert('Deposit Error: ' + error.message);
      } else {
        alert('Deposit submitted successfully! Status: Pending Approval.');
        document.getElementById('deposit-amount').value = '';
        calculateROI();
        fetchDeposits();
      }
    }

    // 5. Automatic Real-Time Listener (Updates balance as soon as admin approves)
    function listenToRealtimeDeposits() {
      supabase
        .channel('public:deposits')
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'deposits', filter: `user_id=eq.${currentUser.id}` },
          (payload) => {
            // Re-calculate balance and list immediately when admin updates status to approved
            loadUserData();
          }
        )
        .subscribe();
    }

    // Initialize on page load
    window.onload = () => {
      loadUserData();
      calculateROI();
    };
  </script>
</body>
</html>
